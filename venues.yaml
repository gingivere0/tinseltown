# Venues the weekly job collects. Each entry is rendered in a headless browser,
# and Claude pulls the screenings for the coming week out of the page text.
#
# style:
#   repertory  one row per film per run of dates, with showtimes (New Beverly, Cinematheque)
#   weekly     one row per film for the week, no showtimes (AMC, Laemmle, Landmark)
# urls: one or more pages to read; pages are concatenated before extraction.
# manual: true   skipped by the job and listed in the weekly summary instead.

