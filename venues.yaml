# Venues the weekly job collects.
#
# parser:  which module in tinseltown/parsers reads the site
# style:   repertory  one row per film per run of dates, with showtimes
#          weekly     one row per film for the week, no showtimes (first-run chains)
# manual:  the site can't be read automatically (it blocks automated visitors, or
#          posts its calendar only on social media); listed in the weekly summary instead.

- venue: The New Beverly
  parser: newbev
  style: repertory
  urls: ["https://thenewbev.com/schedule/"]

