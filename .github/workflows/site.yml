name: Stats website

# Snapshot the sheet and publish the site in site/ to GitHub Pages: every morning,
# after each listings run or manual sync, whenever the site changes, and on demand.
on:
  schedule:
    - cron: "30 14 * * *"
  workflow_run:
    workflows: ["Weekly listings", "Copy manual entries"]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "tinseltown/export.py", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install gspread google-auth pyyaml
      - name: Snapshot the sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
        run: python -m tinseltown export --out site/data/tinseltown.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
