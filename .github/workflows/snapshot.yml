name: Snapshot venue pages

# Saves each venue page (HTML, text, JSON responses) to the `snapshots` branch,
# so parsers can be written and debugged against what the sites actually serve.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - run: python -m tinseltown.snapshot /tmp/snapshots
      - name: Publish to the snapshots branch
        run: |
          cd /tmp/snapshots
          git init -q -b snapshots
          git config user.name "tinseltown-bot"
          git config user.email "tinseltown-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Venue snapshots $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" snapshots
