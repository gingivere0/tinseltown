name: Weekly listings

on:
  schedule:
    - cron: "0 15 * * 5"   # Fridays 15:00 UTC (8 a.m. PDT, 7 a.m. PST)
  workflow_dispatch:
    inputs:
      start:
        description: First day of the week (YYYY-MM-DD); blank for this Friday
        required: false
      only:
        description: Venue names to limit the run to, comma separated
        required: false
      dry_run:
        description: Collect without writing to the sheet
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && python -m playwright install --with-deps chromium
      - name: Collect listings
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ vars.SHEET_ID }}
          START: ${{ inputs.start }}
          ONLY: ${{ inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(run)
          [ -n "$START" ] && args+=(--start "$START")
          [ "$DRY_RUN" = "true" ] && args+=(--dry-run)
          if [ -n "$ONLY" ]; then
            IFS=',' read -ra names <<< "$ONLY"
            args+=(--only)
            for n in "${names[@]}"; do args+=("$(echo "$n" | xargs)"); done
          fi
          python -m tinseltown "${args[@]}"
      - name: Archive the week's CSV
        run: |
          git config user.name "tinseltown-bot"
          git config user.email "tinseltown-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Listings for $(ls -t data | head -1)"
          git push
